name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "A required Android signing secret is missing. See docs/GITHUB_RELEASES.md."
              exit 1
            fi
          done

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Test server bridge
        run: python3 -m unittest discover -s server/tests -v

      - name: Test Android and build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --console=plain -PGITHUB_REPOSITORY="$GITHUB_REPOSITORY"

      - name: Prepare release assets
        id: assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          METADATA=android/app/build/outputs/apk/release/output-metadata.json
          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$METADATA")
          VERSION_NAME=$(jq -r '.elements[0].versionName' "$METADATA")
          if [ "$TAG_NAME" != "v$VERSION_NAME" ]; then
            echo "Tag $TAG_NAME must match Android versionName v$VERSION_NAME."
            exit 1
          fi
          APK_NAME="ClaudeLink-$TAG_NAME.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          printf '%s  %s\n' "${SHA256^^}" "$APK_NAME" > SHA256SUMS.txt
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/$APK_NAME" \
            --arg sha256 "$SHA256" \
            --arg releaseNotes "CLI 页面顶部收成一行，新增、恢复、扫码及窗口切换通过触碰悬浮菜单显示，为 AI 对话留出更多高度。支持接入正在使用的 Codex 和 Qoder CN，包括尚未发送首条消息的新终端。已有 tmux 窗口直接共享，普通 SSH 终端转入持久窗口并保留原进程；原 SSH 连接随后不再收发该终端内容。断网重连和移除手机入口后保留同一原进程，提供复制桌面连接。保留 UUID 与发送修复、已有对话恢复及应用内研记。" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,releaseNotes:$releaseNotes}' \
            > latest.json
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        env:
          APK_NAME: ${{ steps.assets.outputs.apk_name }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in the Android SDK."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.assets.outputs.apk_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$APK_NAME" SHA256SUMS.txt latest.json \
            --title "Claude Link $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      - name: Remove signing key
        if: always()
        run: rm -f android/release.keystore
