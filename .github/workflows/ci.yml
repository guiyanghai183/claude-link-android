name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Test server bridge
        run: python3 -m unittest discover -s server/tests -v

      - name: Test Android and build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain -PGITHUB_REPOSITORY="$GITHUB_REPOSITORY"

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeLink-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
